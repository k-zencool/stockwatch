# Shared-server deployment: StockWatch running alongside other projects on one VPS
# that already has its own nginx on 80/443 (e.g. the shicenter.net server).
#   docker compose -f docker-compose.server.yml up -d --build
#
# Differences from docker-compose.prod.yml:
#   - no Caddy: the host's nginx owns 80/443. Until a domain is attached the app is
#     reached directly on APP_PORT; later point an nginx reverse proxy at 127.0.0.1:APP_PORT
#     and change the web port binding to "127.0.0.1:${APP_PORT}:80".
#   - every host port comes from .env (default block 9820-9821, so it doesn't collide
#     with shicenter's 9810-9813 block)
#   - MySQL publishes no host port; phpMyAdmin is loopback-only (reach it over an SSH tunnel)

name: stockwatch

services:
  db:
    image: mysql:8.0
    container_name: stockwatch_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - stockwatch_net

  web:
    build: ./php
    container_name: stockwatch_web
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    volumes:
      - ./:/var/www/html
    ports:
      # Loopback only: the host nginx (aaPanel) terminates HTTPS and proxies here
      - "127.0.0.1:${APP_PORT:-9820}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stockwatch_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: stockwatch_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      # Loopback only: reach it with `ssh -L 9821:127.0.0.1:9821 root@<server-ip>`
      - "127.0.0.1:${PMA_PORT:-9821}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stockwatch_net

volumes:
  db_data:

networks:
  stockwatch_net:
