# StockWatch (/opt/stockwatch, docker compose project "stockwatch") behind aaPanel's nginx.
# Certificate: certbot webroot, auto-renewed (see /etc/letsencrypt/renewal/stockkate.duckdns.org.conf).
server {
    listen 80;
    server_name stockkate.duckdns.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/stockkate.duckdns.org; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name stockkate.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/stockkate.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockkate.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:stockwatch_ssl:5m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 20M;

    location ^~ /.well-known/acme-challenge/ { root /var/www/stockkate.duckdns.org; default_type text/plain; }

    location / {
        # The app reads X-Forwarded-Proto for the Secure cookie flag and X-Real-IP for the login rate limiter.
        proxy_pass http://127.0.0.1:9820;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    access_log /www/wwwlogs/stockkate.duckdns.org.log;
    error_log  /www/wwwlogs/stockkate.duckdns.org.error.log;
}
